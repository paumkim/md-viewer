<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="8" fill="url(#bg)"/>

  <!-- Human head (front view) -->
  <ellipse cx="24" cy="19" rx="9" ry="10" fill="#e8d5c4"/>

  <!-- Hair -->
  <path d="M15 16q0-7 9-7q9 0 9 7q0 3-2 5q-1-4-7-4q-6 0-7 4q-2-2-2-5z" fill="#4a3728"/>

  <!-- Eyes -->
  <ellipse cx="20" cy="18" rx="1.8" ry="2" fill="#2c1810"/>
  <ellipse cx="28" cy="18" rx="1.8" ry="2" fill="#2c1810"/>
  <!-- Eye highlights -->
  <circle cx="20.5" cy="17" r="0.7" fill="rgba(255,255,255,0.6)"/>
  <circle cx="28.5" cy="17" r="0.7" fill="rgba(255,255,255,0.6)"/>

  <!-- Nose (subtle) -->
  <path d="M24 21q1 2 0 3" fill="none" stroke="#c4a88a" stroke-width="1" stroke-linecap="round"/>

  <!-- Mouth (gentle smile) -->
  <path d="M20 26q4 3 8 0" fill="none" stroke="#c4a88a" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Shoulders -->
  <path d="M12 38q0-5 3-8q3-3 9-3q6 0 9 3q3 3 3 8"
        fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>

  <!-- Subtle glow/thought around head -->
  <circle cx="35" cy="9" r="2" fill="rgba(100,180,255,0.3)"/>
  <circle cx="38" cy="14" r="1.2" fill="rgba(100,180,255,0.2)"/>
  <circle cx="10" cy="10" r="1.5" fill="rgba(100,180,255,0.25)"/>
</svg>
